<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111214">
<link rel="icon" href="data:,">
<title>Motorljud – välj din motor</title>
<style>
  :root{
    --bg:#0e0f11; --panel:#17191c; --panel2:#1f2226; --line:#2b2f35;
    --txt:#f2f3f5; --dim:#9aa0a8; --acc:#3e6ae1; --acc2:#5b84ff; --red:#e82127; --ok:#33c26b; --warn:#f0a020;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Gotham SSm","Gotham","Helvetica Neue",Arial,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;padding:1.6vh 1.6vw;gap:1.6vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:1vw}
  h1{margin:0;font-size:clamp(20px,2.4vw,46px);font-weight:600;letter-spacing:.02em}
  h1 span{color:var(--dim);font-weight:400}
  .chips{display:flex;gap:.7vw;flex-wrap:wrap;justify-content:flex-end}
  .chip{display:flex;align-items:center;gap:.5em;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:.45em 1em;font-size:clamp(12px,1.05vw,20px);color:var(--dim);white-space:nowrap}
  .dot{width:.7em;height:.7em;border-radius:50%;background:#555}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--red)}
  main{display:grid;grid-template-columns:1.15fr 1fr;gap:1.6vw;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0}
  .gauge{position:relative;display:flex;align-items:center;justify-content:center;padding:1vh}
  #tach{width:100%;height:100%;display:block}
  .right{display:grid;grid-template-rows:auto 1fr;gap:1.6vh;min-height:0}
  .readout{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:1vw;padding:1.6vh 1.4vw;align-items:end}
  .big{font-size:clamp(48px,7.2vw,150px);font-weight:300;line-height:.9;font-variant-numeric:tabular-nums}
  .mid{font-size:clamp(30px,3.6vw,76px);font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
  .lbl{color:var(--dim);font-size:clamp(12px,1.1vw,22px);margin-top:.5em;letter-spacing:.06em;text-transform:uppercase}
  .engines{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1vh 1vw;padding:1.4vh 1.2vw;min-height:0}
  .eng{appearance:none;border:2px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:14px;text-align:left;
    padding:1.1vh 1.1vw;cursor:pointer;display:flex;flex-direction:column;justify-content:center;min-height:0;transition:border-color .15s,background .15s}
  .eng b{font-size:clamp(16px,1.6vw,32px);font-weight:600}
  .eng small{color:var(--dim);font-size:clamp(11px,.95vw,19px);margin-top:.35em;line-height:1.25}
  .eng.sel{border-color:var(--acc2);background:#1d2a4a}
  .eng:active{transform:scale(.985)}
  .eng.wide{grid-column:span 2}
  footer{display:grid;grid-template-columns:auto 1fr auto;gap:1.6vw;align-items:stretch}
  .btn{appearance:none;border:0;border-radius:14px;background:var(--panel2);color:var(--txt);font:inherit;
    font-size:clamp(16px,1.5vw,30px);font-weight:600;padding:0 2vw;min-height:clamp(56px,8vh,110px);cursor:pointer;border:1px solid var(--line)}
  .btn:active{filter:brightness(1.25)}
  .btn.start{background:var(--acc);border-color:var(--acc);min-width:clamp(160px,17vw,340px);font-size:clamp(20px,2vw,40px)}
  .btn.start.on{background:var(--red);border-color:var(--red)}
  .btn.toggle.on{background:#1d2a4a;border-color:var(--acc2);color:#fff}
  .ctrl{display:flex;align-items:center;gap:1.2vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 1.4vw;min-width:0}
  .ctrl label{color:var(--dim);font-size:clamp(12px,1.1vw,22px);white-space:nowrap;min-width:5.5em}
  .ctrl .val{font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right;font-size:clamp(14px,1.2vw,24px)}
  .rows{display:grid;grid-template-rows:1fr 1fr;gap:1vh}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:clamp(36px,5vh,64px);background:transparent;min-width:0}
  input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:#33373e}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:clamp(30px,2.6vw,52px);height:clamp(30px,2.6vw,52px);border-radius:50%;
    background:#fff;margin-top:calc((12px - clamp(30px,2.6vw,52px))/2);box-shadow:0 2px 8px #0008}
  input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:#33373e}
  input[type=range]::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:#fff;border:0}
  input[type=range]:disabled{opacity:.35}
  input[type=range]{touch-action:none}
  .vbtn{flex:0 0 auto;width:clamp(48px,4.5vw,80px);height:clamp(48px,4.5vw,80px);border-radius:14px;border:0;background:#33373e;color:#fff;font-size:clamp(26px,2.6vw,44px);font-weight:700;line-height:1;cursor:pointer;touch-action:manipulation}
  .vbtn:active{background:#4a4f58}
  .side{display:flex;flex-direction:column;gap:1vh}
  .side .btn{flex:1;min-height:0}
  #msg{position:fixed;left:50%;top:12vh;transform:translateX(-50%);max-width:70vw;background:#2a1a1a;border:1px solid var(--red);
    color:#ffd9d9;padding:1.2em 1.6em;border-radius:14px;font-size:clamp(14px,1.3vw,26px);display:none;z-index:5;box-shadow:0 10px 40px #000a}
  #msg.info{background:#1a2238;border-color:var(--acc2);color:#dfe7ff}
  #msg button{margin-top:.8em}
  .credit{color:#5d636b;font-size:clamp(10px,.75vw,15px);text-align:center;margin-top:.4vh}
  .credit a{color:#7d848d}

  /* ===== Mobil i liggande läge ===== */
  @supports (height:100dvh){ .app{height:100dvh} }
  @media (orientation:landscape) and (max-height:540px){
    .app{padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));gap:6px}
    h1{font-size:16px}
    .chips{gap:4px}
    .chip{font-size:10px;padding:3px 7px}
    main{grid-template-columns:0.9fr 1.25fr;gap:8px}
    .card{border-radius:12px}
    .gauge{padding:2px}
    .right{gap:6px}
    .readout{padding:6px 10px;gap:6px}
    .big{font-size:clamp(30px,11vh,56px)}
    .mid{font-size:clamp(20px,7vh,36px)}
    .lbl{font-size:10px;margin-top:2px}
    .engines{grid-template-columns:repeat(3,1fr);gap:5px;padding:6px}
    .eng.wide{grid-column:1 / -1}
    .eng{padding:4px 8px;border-radius:10px;border-width:2px}
    .eng b{font-size:clamp(12px,3.6vh,16px)}
    .eng small{display:none}
    footer{grid-template-columns:auto 1fr auto;gap:6px}
    .btn{font-size:13px;padding:0 10px;min-height:0;border-radius:10px}
    .btn.start{min-width:110px;font-size:15px}
    .rows{gap:4px}
    .ctrl{gap:6px;padding:0 8px;border-radius:10px}
    .ctrl label{font-size:11px;min-width:4em}
    .ctrl .val{font-size:12px;min-width:3.4em}
    input[type=range]{height:30px}
    input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-6px}
    .vbtn{width:34px;height:30px;font-size:20px;border-radius:8px}
    .side{gap:4px}
    .credit{font-size:9px;margin-top:0;line-height:1}
    .credit .cr-long{display:none}
    #msg{top:4vh;max-width:90vw;font-size:13px;padding:.8em 1em}
  }
  /* Mobil i stående läge: be användaren vrida */
  #rotate{display:none}
  @media (orientation:portrait) and (max-width:600px){
    #rotate{display:flex;position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--txt);align-items:center;justify-content:center;
      flex-direction:column;gap:14px;text-align:center;padding:24px;font-size:18px}
    #rotate .ico{font-size:56px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Motorljud <span id="engTitle">· V8</span></h1>
    <div class="chips">
      <div class="chip"><span class="dot" id="dGps"></span><span id="tGps">GPS: av</span></div>
      <div class="chip"><span class="dot" id="dAud"></span><span id="tAud">Ljud: av</span></div>
      <div class="chip"><span class="dot" id="dWake"></span><span id="tWake">Skärm: normal</span></div>
    </div>
  </header>

  <main>
    <div class="card gauge"><canvas id="tach" aria-label="Varvräknare"></canvas></div>
    <div class="right">
      <div class="card readout">
        <div><div class="big" id="spd">0</div><div class="lbl">km/h</div></div>
        <div><div class="mid" id="gear">N</div><div class="lbl" id="gearLbl">Växel</div></div>
        <div><div class="mid" id="rpm">0</div><div class="lbl" id="rpmLbl">r/min</div></div>
      </div>
      <div class="card engines" id="engines"></div>
    </div>
  </main>

  <footer>
    <button class="btn start" id="startBtn">Starta motorn</button>
    <div class="rows">
      <div class="ctrl"><label for="vol">Volym</label><button type="button" class="vbtn" id="volDown" aria-label="Sänk volymen">−</button><input type="range" id="vol" min="0" max="100" step="5" value="70"><button type="button" class="vbtn" id="volUp" aria-label="Höj volymen">+</button><span class="val" id="volV">70 %</span></div>
      <div class="ctrl"><label for="demoSpd">Demofart</label><input type="range" id="demoSpd" min="0" max="260" value="0" disabled><span class="val" id="demoV">0 km/h</span></div>
    </div>
    <div class="side">
      <button class="btn toggle" id="demoBtn">Demoläge: av</button>
      <button class="btn" id="tripBtn" disabled>Kör testrunda</button>
    </div>
  </footer>
  <div class="credit"><span class="cr-long"><span id="srcInfo"></span> Ljudet är en simulering och följer GPS-hastigheten. Ha alltid fokus på trafiken.<br>Inspelningar: <span id="credits"></span> · </span><a href="sounds/CREDITS.html" target="_blank" rel="noopener">Ljudkällor och licenser</a></div>
</div>
<div id="msg"></div>
<div id="rotate"><div class="ico">📱↻</div><div>Vrid mobilen till liggande läge</div></div>

<script>
"use strict";
/*ENGINES-START*/
// Motorer. gears = km/h per 1000 r/min i varje växel. Vinklar = tändvinklar (grader) i arbetscykeln.
// Fartområde: 0–260 km/h (MAX_KMH). Alla växellådor och kurvor är anpassade så att 260 km/h nås under varvtalsgränsen.
const MAX_KMH = 260;
const ENGINES = {

    cylinders:8, cycleDeg:720,

    res:[[95,1.1,1.0],[300,2.0,0.6],[820,2.6,0.28],[1900,3,0.08]], direct:0.25,
    pipeMs:9, pipeFb:-0.5, pipeDamp:0.35,
    lpLow:900, lpHigh:5200, driveLow:1.3, driveHigh:3.4,
    pops:0.07, popMinRpm:2200, intake:0.10, intakeFc:700, mech:0.025, mechFreq:2600,

  },
  v12: {

    // små skillnader mellan cylindrarna (ger de "halva" motorordningarna = rikedom/rasp) och ett
    // ordningslager (övertoner i 3:e, 6:e, 9:e, 12:e ordningen) som ger det rena, skrikande V12-tjutet på höga varv.
    id:'v12', name:'V12', desc:'Italiensk V12, 6,5 liter – mjuk, rik och högvarvig, 7 växlar, 9 000 r/min',
    cylinders:12, cycleDeg:720,
    fire:[[0,0],[60,1],[120,0],[180,1],[240,0],[300,1],[360,0],[420,1],[480,0],[540,1],[600,0],[660,1]],
    cylAmp:[1,0.88,1.1,0.95,1.05,0.86,0.97,1.12,0.91,1.03,0.93,1.08],
    idle:1000, redline:9000, launch:3200, inertia:0.04, flutter:0, jitter:0.003,
    gears:[9,12.8,16.5,20.5,24.8,29.3,34.5], upCruise:3000, upFull:8700, down:1800, shiftTime:0.1, aRef:10,
    pulseTau:0.0006, noiseMix:0.16, noiseTau:0.002, variance:0.05, misfire:0,
    knock:0, knockFreq:3000,
    banks:2, bankDetune:1.04,
    res:[[150,1.0,1.2],[320,1.4,1.0],[620,1.6,0.9],[1250,2.0,0.6],[2500,2.5,0.32],[4200,3,0.12]], direct:0.3,
    pipeMs:4, pipeFb:-0.35, pipeDamp:0.25,
    lpLow:1800, lpHigh:8500, driveLow:1.3, driveHigh:3.0,
    pops:0.05, popMinRpm:3500, intake:0.2, intakeFc:1600, mech:0.02, mechFreq:3800,
    orders:{list:[[1.5,0.10],[3,0.55],[4.5,0.14],[6,1],[7.5,0.1],[9,0.45],[12,0.6],[15,0.18],[18,0.28],[24,0.14]], gain:0.1, fmax:7500, lo:0.35},
    turbo:null, fan:null, prop:null, tracks:0, wind:0, gain:1.7
  },
  merlin: {
    // Rolls-Royce Merlin 66: 60°-V12, 27 liter, korta avgasstubbar (varje cylinder hörs), tvåstegskompressor,
    // fyrbladig propeller (utväxling 0,477). Varvtalet stiger mjukt med farten (650 -> ca 2 950 r/min vid 260 km/h).
    id:'merlin', name:'Spitfire', desc:'Rolls-Royce Merlin V12, 27 liter – djupt mullrande, kompressor och propeller',
    cylinders:12, cycleDeg:720, mode:'prop',
    fire:[[0,0],[60,1],[120,0],[180,1],[240,0],[300,1],[360,0],[420,1],[480,0],[540,1],[600,0],[660,1]],
    cylAmp:[1,0.86,1.1,0.92,1.04,0.88,1.08,0.95,0.9,1.06,0.93,1.0],
    idle:650, redline:3000, cruise:2850, inertia:0.22, flutter:0, jitter:0.006,
    gears:[1], upCruise:0, upFull:0, down:0, shiftTime:0, aRef:8,
    pulseTau:0.0016, noiseMix:0.42, noiseTau:0.0032, variance:0.12, misfire:0.008,
    knock:0.03, knockFreq:1700,
    banks:2, bankDetune:1.05,
    res:[[70,1.0,1.2],[145,1.3,0.9],[310,1.8,0.35],[720,2.4,0.18],[1700,3,0.06]], direct:0.35,
    pipeMs:2.2, pipeFb:-0.25, pipeDamp:0.3,
    lpLow:900, lpHigh:4800, driveLow:1.8, driveHigh:3.6,
    pops:0.06, popMinRpm:1400, intake:0.06, intakeFc:800, mech:0.03, mechFreq:2100,
    orders:{list:[[0.5,0.45],[1,0.45],[1.5,0.4],[3,1],[4.5,0.3],[6,0.45],[9,0.14],[12,0.08]], gain:0.12, fmax:1500, lo:0.5},
    turbo:{type:'sc', fmin:0, fk:0.62, gain:0.035, whoosh:0.025},
    fan:null, prop:{blades:4, reduction:0.477, gain:0.24}, tracks:0, wind:0.10, gain:1.5
  },
  harley: {
    // 45°-V-twin (Milwaukee-Eight 114, 1 868 cc), gemensam vevtapp: tändning vid 0° och 315° -> 315°/405°-mellanrum

    fire:[[0,0],[315,0]], cylAmp:[1,0.8],
    idle:760, redline:5600, launch:1700, inertia:0.12, flutter:0.1, jitter:0.012,

    pulseTau:0.0034, noiseMix:0.42, noiseTau:0.006, variance:0.16, misfire:0,
    knock:0.06, knockFreq:1400,
    banks:1, bankDetune:1,
    res:[[52,1.2,1.0],[115,1.6,0.85],[240,2.0,0.5],[600,2.5,0.2],[1500,3,0.06]], direct:0.22,
    pipeMs:13, pipeFb:-0.35, pipeDamp:0.5,
    lpLow:650, lpHigh:4200, driveLow:1.9, driveHigh:4.2,
    pops:0.12, popMinRpm:1700, intake:0.08, intakeFc:600, mech:0.03, mechFreq:1900,
    turbo:null, fan:null, prop:null, tracks:0, wind:0.04, gain:2.0
  },
  mazda787b: {
    // R26B fyrrotors wankel, 2,6 liter, Le Mans 1991. Varje rotor tänder en gång per excenteraxelvarv -> 4 pulser/varv,
    // jämnt fördelade = slätt, gällt skrik utan V-motorns mullrande. Perifera insugsportar -> ojämn, "brappig" tomgång.
    id:'mazda787b', name:'Mazda 787B', desc:'R26B fyrrotors wankel – skrikande rotorvrål till 9 000 r/min, 5 växlar',
    cylinders:4, cycleDeg:360,
    fire:[[0,0],[90,0],[180,0],[270,0]], cylAmp:[1,0.9,1.06,0.94],
    idle:1500, redline:9000, launch:4000, inertia:0.035, flutter:0, jitter:0.01,
    gears:[11,15.5,20.5,25.5,31], upCruise:4600, upFull:8800, down:3300, shiftTime:0.09, aRef:12,
    pulseTau:0.0004, noiseMix:0.5, noiseTau:0.0016, variance:0.14, misfire:0.16,
    knock:0, knockFreq:3000,
    banks:1, bankDetune:1,
    res:[[200,1.2,0.5],[620,1.4,1.0],[1500,2.0,0.85],[3200,2.5,0.5],[5600,3,0.25]], direct:0.4,
    pipeMs:3, pipeFb:-0.35, pipeDamp:0.2,
    lpLow:2400, lpHigh:14000, driveLow:1.6, driveHigh:4.0,
    pops:0.1, popMinRpm:4000, intake:0.24, intakeFc:2500, mech:0.025, mechFreq:4500,
    orders:{list:[[1,0.12],[2,0.15],[4,1],[8,0.55],[12,0.3],[16,0.15]], gain:0.08, fmax:8000, lo:0.3},
    turbo:null, fan:null, prop:null, tracks:0, wind:0, gain:1.7
  },
  viggen: {
    // Volvo RM8 (dubbelströmsmotor) med efterbrännkammare. "Varvtal" = högtrycksrotorns varvtal i %.
    // Turbinvisslingen stiger med farten; efterbrännkammaren tänds i tre steg vid högre fart.
    id:'viggen', mode:'jet', name:'AJS 37 Viggen', desc:'Volvo RM8 – turbinvissel, dånande avgaser och efterbrännkammare (EBK) från 150 km/h',
    idle:55, redline:103, inertia:1.1, gain:1.6, aRef:10,
    ab:[150,190,225], abHyst:10
  },
  enterprise: {
    // Helt syntetiserat "varpkärnebrus" (inget inspelat ljud). Ingen växellåda: "varvtal" = warpnivå (0–1 impuls, 1–10 warp).
    // Nivån ökar exponentiellt med farten: lv = 10·(e^(v/75)−1)/(e^(255/75)−1) -> Warp 1 vid ca 104 km/h, Warp 10 vid 255–260 km/h.
    id:'enterprise', mode:'warp', name:'🖖 Enterprise', desc:'USS Enterprise-D – varpkärnans brus. Ökar exponentiellt: impuls under ca 104 km/h, Warp 10 vid 260 km/h',
    idle:0, redline:10.5, inertia:0.6, gain:1.0, warpTau:75
  }
};
/*ENGINES-END*/

/*DSP-START*/
function dspFactory(){
  const TAU = Math.PI*2;
  function bpCoef(s,f,q,sr){
    f = Math.min(f, sr*0.45);
    const w=TAU*f/sr, al=Math.sin(w)/(2*q), a0=1+al;
    s.b0=al/a0; s.b2=-al/a0; s.a1=-2*Math.cos(w)/a0; s.a2=(1-al)/a0; return s;

          const f=fire[k][0];

          if(this.trackPh>=1){ this.trackPh-=1; this.trackEnv=Math.min(1,0.2+spdMs/12)*(0.6+0.4*(this.rnd()*0.5+0.5)); }

const Audio = {
  ctx:null, node:null, gain:null, dsp:null, ready:false,
  async init(){
    const AC = window.AudioContext||window.webkitAudioContext;

    comp.threshold.value=-10; comp.knee.value=8; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.15;
    this.gain.connect(comp); comp.connect(this.ctx.destination);
    let usedWorklet=false;
    if(this.ctx.audioWorklet && window.Blob && window.URL){
      try{
        const src = 'const EngineDSP=('+dspFactory.toString()+')();\n'+
          'class EP extends AudioWorkletProcessor{constructor(){super();this.d=new EngineDSP(sampleRate);'+
          'this.port.onmessage=e=>{const m=e.data;if(m.sample)this.d.setSample(m.sample);if(m.cfg)this.d.setConfig(m.cfg);if(m.p)this.d.setParams(m.p);};}'+
          'process(i,o){const out=o[0];const L=out[0],R=out[1]||out[0];this.d.process(L,R,L.length);return true;}}'+
          'registerProcessor("engine-proc",EP);';
        const url = URL.createObjectURL(new Blob([src],{type:'application/javascript'}));
        await this.ctx.audioWorklet.addModule(url);
        this.node = new AudioWorkletNode(this.ctx,'engine-proc',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
        usedWorklet=true;
      }catch(e){ console.warn('AudioWorklet misslyckades, använder reserv', e); }
    }
    if(!usedWorklet){
      const EngineDSP = dspFactory();
      this.dsp = new EngineDSP(this.ctx.sampleRate);
      this.node = this.ctx.createScriptProcessor(2048,0,2);
      this.node.onaudioprocess = e=>{ const b=e.outputBuffer; this.dsp.process(b.getChannelData(0),b.getChannelData(1),b.length); };
    }
    // Kupé: kort rumsklang (syntetiskt impulssvar) + mjuk klangfärg som i en bilkupé
    try{
      const sr=this.ctx.sampleRate, len=Math.round(sr*0.24), ir=this.ctx.createBuffer(2,len,sr);
      for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); let lp=0, seed=ch?7771:1234;
        for(let i=0;i<len;i++){ seed=(seed*1103515245+12345)&0x7fffffff; const nz=seed/0x3fffffff-1; lp+=(nz-lp)*0.35;
          d[i]=lp*Math.exp(-i/(sr*0.045))*(i<sr*0.002?i/(sr*0.002):1); }
        [0.0031,0.0047,0.0068,0.0093].forEach((t,k)=>{ const j=Math.round(t*sr*(ch?1.07:1)); if(j<len) d[j]+=0.5/(k+1); }); }
      const conv=this.ctx.createConvolver(); conv.buffer=ir;
      const wet=this.ctx.createGain(); wet.gain.value=0.22; const dry=this.ctx.createGain(); dry.gain.value=0.9;
      const low=this.ctx.createBiquadFilter(); low.type='peaking'; low.frequency.value=110; low.Q.value=0.8; low.gain.value=2.5;
      const hi=this.ctx.createBiquadFilter(); hi.type='highshelf'; hi.frequency.value=5000; hi.gain.value=-4;
      this.node.connect(dry); this.node.connect(conv); conv.connect(wet); dry.connect(low); wet.connect(low); low.connect(hi); hi.connect(this.gain);
    }catch(e){ this.node.connect(this.gain); }

    this.ready=true;
  },
  send(msg,tr){ if(!this.ready)return; if(this.dsp){ if(msg.sample)this.dsp.setSample(msg.sample); if(msg.cfg)this.dsp.setConfig(msg.cfg); if(msg.p)this.dsp.setParams(msg.p);} else this.node.port.postMessage(msg,tr||[]); },
  // Hämtar inspelningen för en motor (sounds/<id>.mp3 + varvtalskarta .json). Misslyckas det används enbart syntesen.
  samples:{}, sampleState:{},
  async loadSample(id){
    if(!id||!this.ready||this.sampleState[id]) return;
    this.sampleState[id]='laddar';
    try{
      const [mr, ar] = await Promise.all([fetch('sounds/'+id+'.json'), fetch('sounds/'+id+'.mp3')]);
      if(!mr.ok||!ar.ok) throw new Error('HTTP '+mr.status+'/'+ar.status);
      const map=await mr.json(); const ab=await ar.arrayBuffer();
      const buf=await new Promise((res,rej)=>{ const p=this.ctx.decodeAudioData(ab,res,rej); if(p&&p.then)p.then(res,rej); });

  setVolume(v){ if(!this.ctx||!this.gain)return; const g=Math.pow(Math.max(0,Math.min(100,v))/100,2); const p=this.gain.gain, t=this.ctx.currentTime; try{ p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); p.linearRampToValueAtTime(g,t+0.06);}catch(e){ p.value=g; } }

/* ===================== Hastighet: GPS och demoläge ===================== */
const Speed = {
  watchId:null, last:null, fixV:0, fixA:0, fixT:0, hasFix:false, status:'off', acc:null,
  start(){
    if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
      setGps('err','GPS: kräver HTTPS');
      showMsg('Platstjänster (GPS) fungerar bara när sidan öppnas via en säker https-adress. Använd Demoläge för att testa.');
      return;
    }
    if(!('geolocation' in navigator)){ setGps('err','GPS: saknas'); showMsg('Den här webbläsaren ger inte tillgång till position. Använd Demoläge för att testa ljuden.'); return; }
    if(this.watchId!=null) return;
    setGps('warn','GPS: söker…');
    const opt={enableHighAccuracy:true, maximumAge:0, timeout:15000};
    this.watchId=-1; this.gotOne=false;
    // Äldre Tesla-webbläsare nekade watchPosition utan att fråga – därför först en engångsfråga
    // (visar behörighetsdialogen) och sedan kontinuerlig bevakning. Om bevakning nekas trots att
    // engångsfrågan fungerade, används polling med getCurrentPosition varje sekund.
    navigator.geolocation.getCurrentPosition(p=>{ this.gotOne=true; if(this.watchId===-1) this.beginWatch(opt); this.onPos(p); },
      e=>{ if(e.code===1){ this.onErr(e); } else if(this.watchId===-1) this.beginWatch(opt); }, opt);
  },
  beginWatch(opt){
    if(this.watchId!==-1) return;
    this.watchId = navigator.geolocation.watchPosition(p=>{ this.gotOne=true; this.onPos(p); }, e=>{
      if(e.code===1 && this.gotOne){ this.startPolling(opt); } else this.onErr(e);
    }, opt);
  },
  startPolling(opt){
    if(this.pollId) return;
    if(this.watchId!=null && this.watchId>=0) navigator.geolocation.clearWatch(this.watchId);
    this.watchId=-2;
    this.pollId=setInterval(()=>navigator.geolocation.getCurrentPosition(p=>this.onPos(p),()=>{},{enableHighAccuracy:true,maximumAge:0,timeout:2500}),1000);
  },
  stop(){ if(this.watchId!=null && this.watchId>=0) navigator.geolocation.clearWatch(this.watchId); this.watchId=null;
    if(this.pollId){ clearInterval(this.pollId); this.pollId=null; } setGps('','GPS: av'); },
  onPos(p){
    const t=(p.timestamp||Date.now())/1000, c=p.coords; let v=null;
    if(c.speed!=null && !isNaN(c.speed) && c.speed>=0) v=c.speed*3.6;
    else if(this.last){
      const dt=t-this.last.t;
      if(dt>=0.5){
        const d=haversine(this.last.lat,this.last.lon,c.latitude,c.longitude);
        const accOk=(c.accuracy||99)<40;
        v = accOk ? d/dt*3.6 : null;
        if(v!=null && d < (c.accuracy||10)*0.5 && dt<3) v = v*0.5; // brus vid stillastående
      }
    }
    if(!this.last || t-this.last.t>=0.5) this.last={t,lat:c.latitude,lon:c.longitude};
    this.acc=c.accuracy;
    if(v==null){ if(!this.hasFix) setGps('warn','GPS: ±'+Math.round(c.accuracy||0)+' m, väntar på fart'); return; }
    if(v<1.2) v=0;
    const now=performance.now()/1000;
    if(this.hasFix){
      const dt=Math.max(0.2,now-this.fixT);
      let a=(v-this.fixV)/dt; a=Math.max(-25,Math.min(18,a)); // km/h/s, rimlighetsgräns
      v=this.fixV+a*dt;
      this.fixA=this.fixA*0.4+a*0.6;
    }
    this.fixV=v; this.fixT=now; this.hasFix=true;
    setGps('ok','GPS: ±'+Math.round(c.accuracy||0)+' m');
  },
  onErr(e){
    if(e.code===1){
      setGps('err','GPS: nekad');
      showMsg('Platsåtkomst nekades. Motorljudet kan inte följa bilens fart utan GPS. Tillåt plats för den här sidan i webbläsaren (adressfältets lås/inställningar) och ladda om – eller använd Demoläge.');
      this.stop(); setGps('err','GPS: nekad');

    else { setGps('warn','GPS: väntar…'); }
  },
  // uppskattad fart just nu (linjär framskrivning mellan GPS-punkter, max 1,5 s)
  estimate(){
    if(!this.hasFix) return {v:0,a:0};
    const age=performance.now()/1000-this.fixT;
    const ex=Math.min(age,1.5);

  }

function haversine(la1,lo1,la2,lo2){
  const R=6371000, r=Math.PI/180, dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

const Demo = {
  on:false, target:0, v:0, a:0, trip:null,
  step(dt){
    if(this.trip){ const t=(performance.now()-this.trip.t0)/1000; const tv=tripProfile(t); if(tv<0){ this.trip=null; setTripBtn(false);} else { this.target=tv; ui.demoSpd.value=Math.round(tv); ui.demoV.textContent=Math.round(tv)+' km/h'; } }
    const diff=this.target-this.v;
    const up=Math.min(13, 3+Math.abs(diff)*0.35), dn=Math.min(22, 4+Math.abs(diff)*0.5);
    const dv=Math.max(-dn*dt,Math.min(up*dt,diff));
    this.v=Math.max(0,this.v+dv);
    const a=dv/Math.max(dt,1e-3);
    this.a+= (a-this.a)*Math.min(1,dt/0.25);
    return {v:this.v,a:this.a};
  }
};
// testrunda: [tid s, km/h]
const TRIP=[[0,0],[3,0],[14,70],[20,70],[24,45],[34,110],[44,110],[58,260],[64,260],[78,110],[84,30],[88,30],[95,0],[100,0]];
function tripProfile(t){
  if(t>=TRIP[TRIP.length-1][0]) return -1;
  for(let i=1;i<TRIP.length;i++){ if(t<=TRIP[i][0]){ const [t0,v0]=TRIP[i-1],[t1,v1]=TRIP[i]; return v0+(v1-v0)*(t-t0)/(t1-t0);} }
  return -1;
}

/* ===================== Drivlina: växellåda och varvtal ===================== */
const Sim = {
  E:null, v:0, a:0, gear:0, rpm:0, rpmT:0, load:0, shiftUntil:0, lastShift:-9, shiftKind:'', disp:0, limT:0,
  setEngine(E){ this.E=E; this.warp=0; this.ab=0; this.gear=0; this.rpm=E.idle; this.rpmT=E.idle; this.disp=E.idle; this.lastShift=-9; this.shiftUntil=0; },
  step(dt, src, now){
    const E=this.E;
    this.v += (src.v-this.v)*Math.min(1,dt/0.35);
    this.a += (src.a-this.a)*Math.min(1,dt/0.4);
    const v=this.v, a=this.a;
    const stopped = v<1.0;
    let load = 0.1 + 0.25*Math.min(1,v/150) + a/E.aRef;
    if(stopped && Math.abs(a)<1) load = 0;
    load=Math.max(-1,Math.min(1,load));
    let rpmT, gearLbl;
    if(E.mode==='warp'){
      // Exponentiell kurva: nivå = 10·(e^(v/τ)−1)/(e^(260/τ)−1). Impuls under nivå 1 (ca 104 km/h), Warp 10 från 255 km/h (så att 260 säkert ger Warp 10).
      const tau=E.warpTau||75, lvAt=s=>Math.min(10,10*(Math.exp(Math.max(0,s)/tau)-1)/(Math.exp((MAX_KMH-5)/tau)-1));
      const lv=lvAt(v);
      let w=this.warp||0; const up=lv>=1?Math.floor(lv+1e-6):0;
      if(up>w) w=up; else { const dn=lvAt(v+2); const d2=dn>=1?Math.floor(dn+1e-6):0; if(d2<w) w=d2; } // 2 km/h hysteres nedåt
      this.warp=w;
      rpmT = lv;
      gearLbl = w>=1 ? 'Warp '+w : 'Impuls';
      this.rpmT=rpmT; this.load=0;
      this.disp+=(rpmT-this.disp)*Math.min(1,dt/E.inertia);
      return {rpm:rpmT, load:0, speed:v, gearLbl, warp:w};
    }
    if(E.mode==='jet'){
      // Varvtal (% av max) stiger med farten, lite extra vid acceleration. Efterbrännkammaren i tre steg med hysteres.
      const n=Math.pow(Math.min(1,v/235),0.7);
      rpmT=Math.min(E.redline,E.idle+(100-E.idle)*n+3*Math.max(0,Math.min(1,load))*Math.min(1,v/30));
      if(stopped) rpmT=E.idle;

      while(st<th.length && v>=th[st]) st++;

      gearLbl = stopped?'Tomgång':(st>0?'EBK '+st:'Torr');
      this.rpmT=rpmT; this.load=load;
      this.disp+=(rpmT-this.disp)*Math.min(1,dt/E.inertia);
      return {rpm:rpmT, load, speed:v, gearLbl, ab:st};
    }
    if(E.mode==='prop'){
      // varvtalet stiger mjukt och hela vägen till 260 km/h (snabbare i början, planar ut mot toppen)
      const ss=(1-Math.exp(-v/110))/(1-Math.exp(-MAX_KMH/110)), s50=Math.min(1,v/50);
      rpmT=E.idle+(E.cruise-E.idle)*Math.min(1,ss)+120*Math.max(0,load)*s50-140*Math.max(0,-load)*s50;
      rpmT=Math.min(E.redline,Math.max(E.idle,rpmT));
      gearLbl = stopped?'—':(load>0.5?'Full':(load<-0.2?'Glid':'Fart'));
    }else{
      const G=E.gears, n=G.length, r=g=>v/G[g]*1000;
      if(now>this.shiftUntil){
        const lp=Math.max(0,Math.min(1,load));
        const up=E.upCruise+(E.upFull-E.upCruise)*Math.pow(lp,1.2);
        let g=this.gear;
        if(stopped || v<3){ g=0; }
        else if(g<n-1 && r(g)>up && r(g+1)>E.down*1.12 && (a>-1.5 || r(g)>E.upFull) && now-this.lastShift>0.7){ g++; } // ingen uppväxling vid inbromsning
        else if(g>0 && (r(g)<E.down ||
                 (load>0.7 && r(g-1)<E.upFull*0.85 && now-this.lastShift>1.5) ||
                 (load<-0.35 && r(g-1)<E.upCruise*0.95 && now-this.lastShift>1.2))){ g--; }
        if(g!==this.gear){
          this.shiftKind = g>this.gear?'up':'down';
          if(!(v<3)) { this.shiftUntil=now+(this.shiftKind==='up'?E.shiftTime:Math.min(E.shiftTime,0.25)); this.lastShift=now; }
          this.gear=g;
        }
      }
      let wheel=r(this.gear);
      rpmT=Math.max(E.idle,wheel);
      if(this.gear===0 && v>0.3 && wheel<E.launch && load>0.05){
        rpmT=Math.max(wheel,E.idle+(E.launch-E.idle)*Math.min(1,load*1.6));
      }
      if(now<this.shiftUntil){
        if(this.shiftKind==='up') load=-0.25; else load=0.45; // gaslyft vid uppväxling, mellangas vid nedväxling
        if(this.shiftKind==='down') rpmT*=1.06;
      }
      if(rpmT>E.redline){ // varvbegränsare
        this.limT+=dt; const cut=(Math.floor(this.limT*9)%2)===0;
        rpmT=E.redline-(cut?E.redline*0.03:0); if(cut) load=-0.3;
      }
      gearLbl = stopped ? 'N' : String(this.gear+1);
    }
    if(stopped){ rpmT=E.idle*(1+0.012*Math.sin(now*1.7)+0.006*Math.sin(now*4.3)); }
    this.rpmT=rpmT; this.load=load;
    this.disp+= (rpmT-this.disp)*Math.min(1,dt/Math.max(0.05,E.inertia));
    return {rpm:rpmT, load, speed:v, gearLbl};
  }
};

/* ===================== Gränssnitt ===================== */
const $=id=>document.getElementById(id);
const ui={ tach:$('tach'), spd:$('spd'), gear:$('gear'), gearLbl:$('gearLbl'), rpm:$('rpm'), engines:$('engines'), startBtn:$('startBtn'),
  vol:$('vol'), volV:$('volV'), demoSpd:$('demoSpd'), demoV:$('demoV'), demoBtn:$('demoBtn'), tripBtn:$('tripBtn'), msg:$('msg'), engTitle:$('engTitle') };
let running=false, engineId=localStorage.getItem('motorljud.engine')||'v8';
if(!ENGINES[engineId]) engineId='v8';

function setDot(id,cls){ const d=$(id); d.className='dot'+(cls?' '+cls:''); }
function setGps(cls,txt){ setDot('dGps',cls); $('tGps').textContent=txt; }
function showMsg(t,info){ ui.msg.className=info?'info':''; ui.msg.innerHTML=''; const p=document.createElement('div'); p.textContent=t; ui.msg.appendChild(p);
  const b=document.createElement('button'); b.className='btn'; b.textContent='OK'; b.onclick=()=>ui.msg.style.display='none'; ui.msg.appendChild(b); ui.msg.style.display='block'; }

function buildEngines(){
  ui.engines.innerHTML='';
  Object.values(ENGINES).forEach((E,i,arr)=>{
    const b=document.createElement('button'); b.className='eng'+(E.id===engineId?' sel':'')+(i===arr.length-1&&arr.length%2?' wide':'');
    b.innerHTML='<b></b><small></small>'; b.querySelector('b').textContent=E.name; b.querySelector('small').textContent=E.desc;
    b.onclick=()=>selectEngine(E.id); b.dataset.id=E.id; ui.engines.appendChild(b);
  });
}
function selectEngine(id){
  engineId=id; localStorage.setItem('motorljud.engine',id);
  [...ui.engines.children].forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  const E=ENGINES[id]; ui.engTitle.textContent='· '+E.name; ui.gearLbl.textContent=(E.mode==='prop'||E.mode==='jet')?'Läge':(E.mode==='warp'?'Fart':'Växel'); $('rpmLbl').textContent=E.mode==='warp'?'Kärneffekt':(E.mode==='jet'?'Varvtal':'r/min');
  document.body.classList.toggle('warp',E.mode==='warp');
  Sim.setEngine(E); tach.setup(E);
  if(Audio.ready){
    // kort övertoning vid motorbyte
    const t=Audio.ctx.currentTime; Audio.gain.gain.cancelScheduledValues(t); Audio.gain.gain.setTargetAtTime(0,t,0.04);
    setTimeout(()=>{ Audio.send({cfg:E, p:{rpm:E.idle,load:0,on:running}}); Audio.setVolume(+ui.vol.value); },160);
    Audio.loadSample(E.sample);
  }
  updateSrcInfo();
}

/* --- varvräknare --- */
const tach={
  E:null, max:0, step:0, div:1000,
  setup(E){ this.E=E;
    if(E.mode==='warp'){ this.max=10; this.step=1; this.div=1; this.resize(); return; }
    if(E.mode==='jet'){ this.max=110; this.step=10; this.div=1; this.resize(); return; }
    const steps=[50,100,200,250,500,1000]; const top=E.redline*1.1;
    this.step=steps.find(s=>top/s<=11)||1000; this.max=Math.ceil(top/this.step)*this.step;
    this.div = this.max>=5000?1000:100; this.resize(); },
  resize(){ const c=ui.tach, r=c.parentElement.getBoundingClientRect(), d=window.devicePixelRatio||1;
    c.width=Math.max(10,(r.width-20)*d); c.height=Math.max(10,(r.height-20)*d); c.style.width=(r.width-20)+'px'; c.style.height=(r.height-20)+'px'; },
  draw(rpm,gear,load){
    const c=ui.tach, g=c.getContext('2d'), W=c.width, H=c.height, E=this.E; if(!E)return;
    g.clearRect(0,0,W,H);
    if(E.mode==='warp') return this.drawWarp(g,W,H,rpm,gear);
    const cx=W/2, cy=H*0.54, R=Math.min(W*0.46,H*0.47);
    const a0=Math.PI*0.75, a1=Math.PI*2.25, ang=v=>a0+(a1-a0)*Math.min(1.02,v/this.max);
    g.lineCap='round';
    g.lineWidth=R*0.075; g.strokeStyle='#262a30'; g.beginPath(); g.arc(cx,cy,R*0.9,a0,a1); g.stroke();
    g.strokeStyle='#5a1518'; g.beginPath(); g.arc(cx,cy,R*0.9,ang(E.redline),a1); g.stroke();
    const grad=g.createLinearGradient(cx-R,0,cx+R,0); grad.addColorStop(0,'#2f55c9'); grad.addColorStop(1,'#6f95ff');
    g.strokeStyle= rpm>E.redline*0.97?'#e82127':grad; g.beginPath(); g.arc(cx,cy,R*0.9,a0,ang(rpm)); g.stroke();
    // skala
    g.fillStyle='#c9ced6'; g.textAlign='center'; g.textBaseline='middle'; g.font=Math.round(R*0.085)+'px Helvetica, Arial, sans-serif';
    const minor=this.step/2;
    for(let v=0; v<=this.max+1; v+=minor){
      const A=ang(v), major=Math.abs(v/this.step-Math.round(v/this.step))<1e-6;
      const r1=R*0.78, r2=major?R*0.68:R*0.73;
      g.strokeStyle=v>=E.redline?'#e82127':(major?'#d8dce2':'#5c626b'); g.lineWidth=major?R*0.018:R*0.01;
      g.beginPath(); g.moveTo(cx+Math.cos(A)*r1,cy+Math.sin(A)*r1); g.lineTo(cx+Math.cos(A)*r2,cy+Math.sin(A)*r2); g.stroke();
      if(major){ const t=v/this.div; g.fillStyle=v>=E.redline?'#ff6b6f':'#c9ced6';
        g.fillText(Number.isInteger(t)?String(t):t.toFixed(1),cx+Math.cos(A)*R*0.57,cy+Math.sin(A)*R*0.57); }
    }
    // nål
    const A=ang(rpm);
    g.strokeStyle='#ff3b40'; g.lineWidth=R*0.022; g.beginPath(); g.moveTo(cx-Math.cos(A)*R*0.08,cy-Math.sin(A)*R*0.08); g.lineTo(cx+Math.cos(A)*R*0.82,cy+Math.sin(A)*R*0.82); g.stroke();
    g.fillStyle='#1b1e22'; g.beginPath(); g.arc(cx,cy,R*0.3,0,Math.PI*2); g.fill();
    g.strokeStyle='#30353c'; g.lineWidth=R*0.012; g.stroke();
    g.fillStyle='#fff'; g.font='600 '+Math.round(R*(String(gear).length>3?0.13:(String(gear).length>2?0.2:0.3)))+'px Helvetica, Arial, sans-serif'; g.fillText(gear,cx,cy+R*0.01);
    g.fillStyle='#8d939b'; g.font=Math.round(R*0.065)+'px Helvetica, Arial, sans-serif';
    g.fillText(E.mode==='jet'?'% varvtal':'×'+this.div+' r/min',cx,cy+R*0.42);
    // lastindikator
    const lw=R*0.9, lx=cx-lw/2, ly=cy+R*0.62, lh=R*0.045;
    g.fillStyle='#262a30'; g.fillRect(lx,ly,lw,lh);
    g.fillStyle=load>=0?'#33c26b':'#f0a020';
    const l=Math.max(-1,Math.min(1,load)); if(l>=0) g.fillRect(cx,ly,lw/2*l,lh); else g.fillRect(cx+lw/2*l,ly,-lw/2*l,lh);
    g.fillStyle='#8d939b'; g.fillText(l>=0?'Gas':'Motorbroms',cx,ly+lh+R*0.07);
  }
};

tach.drawWarp=function(g,W,H,lv,gear){
  const cx=W/2, cy=H*0.54, R=Math.min(W*0.46,H*0.47), a0=Math.PI*0.75, a1=Math.PI*2.25;
  const ang=v=>a0+(a1-a0)*Math.max(0,Math.min(1,v/10));
  const warp=/^Warp/.test(gear), N=warp?parseInt(gear.slice(5),10):0;
  g.lineCap='round'; g.lineWidth=R*0.075; g.strokeStyle='#1c2430'; g.beginPath(); g.arc(cx,cy,R*0.9,a0,a1); g.stroke();
  const grad=g.createLinearGradient(cx-R,0,cx+R,0); grad.addColorStop(0,'#2a6cff'); grad.addColorStop(1,'#8fd0ff');
  g.strokeStyle=grad; g.beginPath(); g.arc(cx,cy,R*0.9,a0,ang(Math.max(0.02,lv))); g.stroke();
  g.textAlign='center'; g.textBaseline='middle'; g.font=Math.round(R*0.085)+'px Helvetica, Arial, sans-serif';
  for(let v=0; v<=10; v++){ const A=ang(v), r1=R*0.78, r2=R*0.68;
    g.strokeStyle=v<=N&&warp&&v>0?'#8fd0ff':'#5c626b'; g.lineWidth=R*0.018;
    g.beginPath(); g.moveTo(cx+Math.cos(A)*r1,cy+Math.sin(A)*r1); g.lineTo(cx+Math.cos(A)*r2,cy+Math.sin(A)*r2); g.stroke();
    g.fillStyle=v===N&&warp?'#fff':'#c9ced6'; g.fillText(v===0?'I':String(v),cx+Math.cos(A)*R*0.57,cy+Math.sin(A)*R*0.57); }
  // pulserande kärna
  const t=performance.now()/1000, pul=0.5+0.5*Math.sin(t*TAU_UI*(0.42+0.07*lv));
  const rg=g.createRadialGradient(cx,cy,0,cx,cy,R*0.36); rg.addColorStop(0,'rgba(140,200,255,'+(0.35+0.35*pul)+')'); rg.addColorStop(1,'rgba(20,40,80,0.9)');
  g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,R*0.36,0,Math.PI*2); g.fill();
  g.strokeStyle='#3a6fb0'; g.lineWidth=R*0.012; g.stroke();
  g.fillStyle='#fff'; g.font='700 '+Math.round(R*(warp?0.3:0.15))+'px Helvetica, Arial, sans-serif';
  g.fillText(warp?String(N):'IMPULS',cx,cy-R*(warp?0.02:0));
  g.fillStyle='#bcd8ff'; g.font='600 '+Math.round(R*0.075)+'px Helvetica, Arial, sans-serif';
  if(warp) g.fillText('WARP',cx,cy+R*0.22);
  g.fillStyle='#8d939b'; g.font=Math.round(R*0.065)+'px Helvetica, Arial, sans-serif';
  g.fillText(warp?'Varpkärna aktiv':'Impulsmotorer',cx,cy+R*0.5);
  g.fillText(warp?'Exponentiell ökning':'Warp 1 vid ca 105 km/h',cx,cy+R*0.64);
};
const TAU_UI=Math.PI*2;

/* --- skärmlås (Wake Lock) --- */
let wakeLock=null;
async function keepAwake(){
  try{ if('wakeLock' in navigator && document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen');
      setDot('dWake','ok'); $('tWake').textContent='Skärm: hålls vaken'; wakeLock.addEventListener('release',()=>{ if(running){ setDot('dWake','warn'); $('tWake').textContent='Skärm: normal'; } }); }
    else { $('tWake').textContent='Skärm: normal'; } }catch(e){ /* tyst */ }
}
document.addEventListener('visibilitychange',()=>{ if(running && document.visibilityState==='visible'){ keepAwake(); if(Audio.ctx&&Audio.ctx.state!=='running')Audio.ctx.resume(); } });

/* --- start/stopp --- */
async function start(){
  try{
    if(!Audio.ready) await Audio.init();
    await Audio.ctx.resume();
  }catch(e){ showMsg('Kunde inte starta ljudet: '+e.message); return; }
  const E=ENGINES[engineId];
  Audio.send({cfg:E, p:{rpm:E.idle,load:0,on:true}}); Audio.setVolume(+ui.vol.value);
  Audio.loadSample(E.sample);
  running=true; ui.startBtn.textContent='Stäng av'; ui.startBtn.classList.add('on');
  setDot('dAud','ok'); $('tAud').textContent='Ljud: på';
  keepAwake();
  if(!Demo.on) Speed.start();
}
function stop(){
  running=false; Audio.send({p:{on:false}}); if(Audio.ctx) setTimeout(()=>{ if(!running && Audio.ctx) Audio.ctx.suspend(); },600);
  ui.startBtn.textContent='Starta motorn'; ui.startBtn.classList.remove('on');
  setDot('dAud',''); $('tAud').textContent='Ljud: av';
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } setDot('dWake',''); $('tWake').textContent='Skärm: normal';
}
ui.startBtn.onclick=()=>running?stop():start();
function applyVol(v){ v=Math.max(0,Math.min(100,Math.round(+v))); ui.vol.value=v; ui.volV.textContent=v+' %'; Audio.setVolume(v); try{localStorage.setItem('motorljud.vol',String(v));}catch(e){} }
ui.vol.addEventListener('input',()=>applyVol(ui.vol.value));
ui.vol.addEventListener('change',()=>applyVol(ui.vol.value));
document.getElementById('volDown').addEventListener('click',()=>applyVol(+ui.vol.value-10));
document.getElementById('volUp').addEventListener('click',()=>applyVol(+ui.vol.value+10));
ui.demoSpd.oninput=()=>{ Demo.trip=null; setTripBtn(false); Demo.target=+ui.demoSpd.value; ui.demoV.textContent=ui.demoSpd.value+' km/h'; };
function setDemo(on){
  Demo.on=on; ui.demoBtn.classList.toggle('on',on); ui.demoBtn.textContent='Demoläge: '+(on?'på':'av');
  ui.demoSpd.disabled=!on; ui.tripBtn.disabled=!on;
  if(on){ Speed.stop(); setGps('', 'GPS: demoläge'); Demo.v=Sim.v; Demo.target=+ui.demoSpd.value; }
  else { Demo.trip=null; setTripBtn(false); if(running) Speed.start(); else setGps('','GPS: av'); }
}
function setTripBtn(on){ ui.tripBtn.textContent=on?'Avbryt testrunda':'Kör testrunda'; ui.tripBtn.classList.toggle('on',on); }
ui.demoBtn.onclick=()=>setDemo(!Demo.on);
ui.tripBtn.onclick=()=>{ if(Demo.trip){ Demo.trip=null; setTripBtn(false); } else { Demo.trip={t0:performance.now()}; setTripBtn(true); if(!running) start(); } };

/* --- huvudslinga (setInterval så den fortsätter även om rAF stryps) --- */
let lastT=performance.now(), lastSend=0;
function tick(){
  const nowMs=performance.now(), dt=Math.min(0.1,(nowMs-lastT)/1000); lastT=nowMs; const now=nowMs/1000;
  const src = Demo.on ? Demo.step(dt) : (running ? Speed.estimate() : {v:0,a:0});
  const out = Sim.step(dt, src, now);
  if(running && nowMs-lastSend>25){ Audio.send({p:{rpm:out.rpm,load:out.load,speed:out.speed,ab:out.ab}}); lastSend=nowMs; }
  window.__state={v:Sim.v,rpm:Sim.disp,rpmT:out.rpm,gear:out.gearLbl,load:out.load,engine:engineId,audio:Audio.mode||null,running};
  return out;
}
function render(out){
  ui.spd.textContent=Math.round(Sim.v);
  ui.gear.textContent=out.gearLbl;
  if(Sim.E&&Sim.E.mode==='jet') ui.rpm.textContent=Math.round(Sim.disp)+' %';
  else if(Sim.E&&Sim.E.mode==='warp') ui.rpm.textContent=Math.round(Sim.disp>=1?25+7.5*Sim.disp:5+20*Sim.disp/0.85)+' %';
  else ui.rpm.textContent=(Math.round(Sim.disp/10)*10).toLocaleString('sv-SE');
  tach.draw(Sim.disp,out.gearLbl,Sim.load);
}
let lastOut={gearLbl:'N'};
setInterval(()=>{ lastOut=tick(); },20);
(function frame(){ render(lastOut); requestAnimationFrame(frame); })();
window.addEventListener('resize',()=>tach.resize());

// Inga inspelningar används längre – alla ljud syntetiseras
const CREDITS = {
  all:'inga – alla motorljud (V8, V12, Spitfire, Harley-Davidson, Mazda 787B, AJS 37 Viggen och Enterprise) syntetiseras i realtid i webbläsaren'
};
function updateSrcInfo(){
  const E=ENGINES[engineId], el=$('srcInfo'); if(!el) return;
  const st=E.sample?Audio.sampleState[E.sample]:null;
  el.textContent = !E.sample ? E.name+': syntetiserat ljud.' :
    st==='ok' ? E.name+': verklig inspelning, tonhöjdsstyrd efter varvtalet.' :
    st==='fel' ? E.name+': inspelningen kunde inte laddas – syntetiskt ljud används.' :
    st==='laddar' ? E.name+': laddar inspelning…' : E.name+': inspelning laddas när motorn startas.';
  const c=$('credits'); if(c) c.textContent=Object.values(CREDITS).join(' · ');
  window.__sample = st||null;
}
// init
const savedVol=localStorage.getItem('motorljud.vol'); if(savedVol!=null){ ui.vol.value=savedVol; ui.volV.textContent=savedVol+' %'; }
buildEngines(); selectEngine(engineId);
if(!window.isSecureContext) setGps('warn','GPS: kräver HTTPS');
</script>
